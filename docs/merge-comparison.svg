<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-label="Two valid offline edits. A vertex-level merge produces a self-intersecting polygon without reporting a conflict. Geomerge applies the edits in a fixed order, keeps crew A's edit, and flags crew B's because it would cross it.">
<defs><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c26a00"/></marker><marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fb8"/></marker><marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="arr-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a3d"/></marker><marker id="arr-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b636e"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#e3e6ea" stroke-width="4"/></pattern></defs>
<rect width="1200" height="1000" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="40" y="58" font-size="30" font-weight="800" fill="#1f2328" text-anchor="start" >Two valid edits, one broken boundary</text><text x="40" y="92" font-size="18" font-weight="400" fill="#5b636e" text-anchor="start" >Each crew's edit is fine on its own. Combined vertex by vertex, the edge folds over itself.</text><rect x="40" y="120" width="360" height="330" rx="14" fill="#f6f8fa" stroke="#e3e6ea" stroke-width="1"/><text x="60" y="152" font-size="20" font-weight="700" fill="#1f2328" text-anchor="start" >1. Starting shape</text><text x="60" y="175" font-size="15" font-weight="400" fill="#5b636e" text-anchor="start" >Both crews download this</text><polygon points="120,410 320,410 320,210 240,330 200,330 120,210" fill="#dbe9f7" fill-opacity="1" stroke="#2f6fb3" stroke-width="3"  stroke-linejoin="round"/><rect x="420" y="120" width="360" height="330" rx="14" fill="#f6f8fa" stroke="#e3e6ea" stroke-width="1"/><text x="440" y="152" font-size="20" font-weight="700" fill="#1f2328" text-anchor="start" >2. Crew A's edit</text><text x="440" y="175" font-size="15" font-weight="400" fill="#5b636e" text-anchor="start" >Hollow dot = where it was</text><polygon points="516.6666666666666,373.33333333333337 683.3333333333333,373.33333333333337 683.3333333333333,206.66666666666666 616.6666666666666,306.6666666666667 583.3333333333333,306.6666666666667 516.6666666666666,206.66666666666666" fill="none" fill-opacity="1" stroke="#9aa4ae" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round"/><polygon points="516.6666666666666,373.33333333333337 683.3333333333333,373.33333333333337 683.3333333333333,206.66666666666666 566.6666666666666,340 583.3333333333333,306.6666666666667 516.6666666666666,206.66666666666666" fill="#dbe9f7" fill-opacity="1" stroke="#2f6fb3" stroke-width="3"  stroke-linejoin="round"/><circle cx="616.6666666666666" cy="306.6666666666667" r="8" fill="#fff" stroke="#c26a00" stroke-width="2.5"/><circle cx="566.6666666666666" cy="340" r="8" fill="#c26a00" stroke="#fff" stroke-width="2.5"/><rect x="436" y="402" width="328" height="34" rx="8" fill="#dcefe2" stroke="none" stroke-width="1"/><text x="600" y="425" font-size="16" font-weight="700" fill="#1f7a3d" text-anchor="middle" >Valid on its own</text><rect x="800" y="120" width="360" height="330" rx="14" fill="#f6f8fa" stroke="#e3e6ea" stroke-width="1"/><text x="820" y="152" font-size="20" font-weight="700" fill="#1f2328" text-anchor="start" >3. Crew B's edit</text><text x="820" y="175" font-size="15" font-weight="400" fill="#5b636e" text-anchor="start" >A different vertex</text><polygon points="896.6666666666667,373.33333333333337 1063.3333333333335,373.33333333333337 1063.3333333333335,206.66666666666666 996.6666666666667,306.6666666666667 963.3333333333334,306.6666666666667 896.6666666666667,206.66666666666666" fill="none" fill-opacity="1" stroke="#9aa4ae" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round"/><polygon points="896.6666666666667,373.33333333333337 1063.3333333333335,373.33333333333337 1063.3333333333335,206.66666666666666 996.6666666666667,306.6666666666667 1013.3333333333334,340 896.6666666666667,206.66666666666666" fill="#dbe9f7" fill-opacity="1" stroke="#2f6fb3" stroke-width="3"  stroke-linejoin="round"/><circle cx="963.3333333333334" cy="306.6666666666667" r="8" fill="#fff" stroke="#7a3fb8" stroke-width="2.5"/><circle cx="1013.3333333333334" cy="340" r="8" fill="#7a3fb8" stroke="#fff" stroke-width="2.5"/><rect x="816" y="402" width="328" height="34" rx="8" fill="#dcefe2" stroke="none" stroke-width="1"/><text x="980" y="425" font-size="16" font-weight="700" fill="#1f7a3d" text-anchor="middle" >Valid on its own</text><rect x="40" y="480" width="550" height="470" rx="14" fill="#f6f8fa" stroke="#e3e6ea" stroke-width="1"/><text x="60" y="512" font-size="20" font-weight="700" fill="#1f2328" text-anchor="start" >Vertex-level merge, no shape check</text><text x="60" y="535" font-size="15" font-weight="400" fill="#5b636e" text-anchor="start" >No conflict detected: the crews touched different vertices</text><polygon points="173.33333333333334,861.6666666666666 456.6666666666667,861.6666666666666 456.6666666666667,578.3333333333334 258.33333333333337,805 371.6666666666667,805 173.33333333333334,578.3333333333334" fill="#fbe1e1" fill-opacity="1" stroke="#c62828" stroke-width="3"  stroke-linejoin="round"/><circle cx="258.33333333333337" cy="805" r="8" fill="#c26a00" stroke="#fff" stroke-width="2.5"/><circle cx="371.6666666666667" cy="805" r="8" fill="#7a3fb8" stroke="#fff" stroke-width="2.5"/><g stroke="#c62828" stroke-width="4" stroke-linecap="round"><line x1="306" y1="731.2380952380952" x2="324" y2="749.2380952380952" stroke="#c62828" stroke-width="4"  /><line x1="306" y1="749.2380952380952" x2="324" y2="731.2380952380952" stroke="#c62828" stroke-width="4"  /></g><rect x="56" y="902" width="518" height="34" rx="8" fill="#fbe1e1" stroke="none" stroke-width="1"/><text x="315" y="925" font-size="16" font-weight="700" fill="#c62828" text-anchor="middle" >Self-intersecting polygon, accepted silently</text><rect x="610" y="480" width="550" height="470" rx="14" fill="#f6f8fa" stroke="#e3e6ea" stroke-width="1"/><text x="630" y="512" font-size="20" font-weight="700" fill="#1f2328" text-anchor="start" >Geomerge: apply in a fixed order, check each</text><text x="630" y="535" font-size="15" font-weight="400" fill="#5b636e" text-anchor="start" >A's edit comes first and fits; B's would cross it (dashed)</text><polygon points="743.3333333333334,861.6666666666666 1026.6666666666667,861.6666666666666 1026.6666666666667,578.3333333333334 828.3333333333334,805 856.6666666666667,748.3333333333333 743.3333333333334,578.3333333333334" fill="#dcefe2" fill-opacity="1" stroke="#1f7a3d" stroke-width="3"  stroke-linejoin="round"/><line x1="856.6666666666667" y1="748.3333333333333" x2="941.6666666666667" y2="805" stroke="#7a3fb8" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arr-b)"/><circle cx="828.3333333333334" cy="805" r="8" fill="#c26a00" stroke="#fff" stroke-width="2.5"/><circle cx="856.6666666666667" cy="748.3333333333333" r="8" fill="#7a3fb8" stroke="#fff" stroke-width="2.5"/><rect x="626" y="902" width="518" height="34" rx="8" fill="#dcefe2" stroke="none" stroke-width="1"/><text x="885" y="925" font-size="16" font-weight="700" fill="#1f7a3d" text-anchor="middle" >Valid · B's edit flagged · same on every device</text></g></svg>
