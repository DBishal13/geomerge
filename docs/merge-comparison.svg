<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-label="Two survey crews each make a valid offline edit to the same polygon. A typical last-edit-wins merge combines them into a self-intersecting polygon without reporting a conflict. Geomerge detects that the combined edits cross, keeps the polygon valid, and reports the two vertices as conflicts.">
<defs><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c26a00"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fb8"/></marker></defs>
<rect width="1200" height="1000" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="40" y="58" font-size="30" font-weight="800" fill="#1f2328">Two valid offline edits, one merged boundary</text><text x="40" y="92" font-size="18" fill="#5b636e">Each crew's edit is fine on its own. Combined vertex-by-vertex, the edge folds over itself.</text><rect x="40" y="120" width="360" height="330" rx="14" fill="#f6f8fa" stroke="#e6e8eb"/><text x="60" y="152" font-size="20" font-weight="700" fill="#1f2328">1. Shared starting shape</text><text x="60" y="175" font-size="15" fill="#5b636e">Both crews sync, then go offline</text><polygon points="121.66666666666666,406.33333333333337 318.3333333333333,406.33333333333337 318.3333333333333,209.66666666666666 239.66666666666666,327.6666666666667 200.33333333333331,327.6666666666667 121.66666666666666,209.66666666666666" fill="#dbe9f7" stroke="#2f6fb3" stroke-width="3"  stroke-linejoin="round" fill-rule="nonzero"/><rect x="420" y="120" width="360" height="330" rx="14" fill="#f6f8fa" stroke="#e6e8eb"/><text x="440" y="152" font-size="20" font-weight="700" fill="#1f2328">2. Crew A edits</text><text x="440" y="175" font-size="15" fill="#5b636e">Moves one vertex (hollow = where it was)</text><polygon points="515,377 685,377 685,207 617,309 583,309 515,207" fill="none" stroke="#9aa4ae" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" fill-rule="nonzero"/><polygon points="515,377 685,377 685,207 702,275 583,309 515,207" fill="#dbe9f7" stroke="#2f6fb3" stroke-width="3"  stroke-linejoin="round" fill-rule="nonzero"/><circle cx="702" cy="275" r="8" fill="#c26a00" stroke="#fff" stroke-width="2.5"/><circle cx="617" cy="309" r="7" fill="#fff" stroke="#c26a00" stroke-width="2.5"/><rect x="436" y="404" width="328" height="32" rx="8" fill="#dcefe2"/><text x="600" y="426" text-anchor="middle" font-size="16" font-weight="700" fill="#1f7a3d">Valid on its own</text><rect x="800" y="120" width="360" height="330" rx="14" fill="#f6f8fa" stroke="#e6e8eb"/><text x="820" y="152" font-size="20" font-weight="700" fill="#1f2328">3. Crew B edits</text><text x="820" y="175" font-size="15" fill="#5b636e">Moves a different vertex</text><polygon points="895,377 1065,377 1065,207 997,309 963,309 895,207" fill="none" stroke="#9aa4ae" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" fill-rule="nonzero"/><polygon points="895,377 1065,377 1065,207 997,309 878,275 895,207" fill="#dbe9f7" stroke="#2f6fb3" stroke-width="3"  stroke-linejoin="round" fill-rule="nonzero"/><circle cx="878" cy="275" r="8" fill="#7a3fb8" stroke="#fff" stroke-width="2.5"/><circle cx="963" cy="309" r="7" fill="#fff" stroke="#7a3fb8" stroke-width="2.5"/><rect x="816" y="404" width="328" height="32" rx="8" fill="#dcefe2"/><text x="980" y="426" text-anchor="middle" font-size="16" font-weight="700" fill="#1f7a3d">Valid on its own</text><rect x="40" y="480" width="550" height="470" rx="14" fill="#f6f8fa" stroke="#e6e8eb"/><text x="60" y="512" font-size="20" font-weight="700" fill="#1f2328">Vertex-level merge (e.g. a generic CRDT)</text><text x="60" y="535" font-size="15" fill="#5b636e">No conflict is detected: the crews touched different vertices</text><polygon points="171.66666666666666,865.3333333333334 458.3333333333333,865.3333333333334 458.3333333333333,578.6666666666666 487,693.3333333333334 142.99999999999997,693.3333333333334 171.66666666666666,578.6666666666666" fill="#fbe1e1" stroke="#c62828" stroke-width="3"  stroke-linejoin="round" fill-rule="nonzero"/><circle cx="487" cy="693.3333333333334" r="8" fill="#c26a00" stroke="#fff" stroke-width="2.5"/><circle cx="142.99999999999997" cy="693.3333333333334" r="8" fill="#7a3fb8" stroke="#fff" stroke-width="2.5"/><g stroke="#c62828" stroke-width="4" stroke-linecap="round"><line x1="449.3333333333333" y1="684.3333333333334" x2="467.3333333333333" y2="702.3333333333334"/><line x1="449.3333333333333" y1="702.3333333333334" x2="467.3333333333333" y2="684.3333333333334"/></g><g stroke="#c62828" stroke-width="4" stroke-linecap="round"><line x1="162.66666666666666" y1="684.3333333333334" x2="180.66666666666666" y2="702.3333333333334"/><line x1="162.66666666666666" y1="702.3333333333334" x2="180.66666666666666" y2="684.3333333333334"/></g><rect x="56" y="904" width="518" height="32" rx="8" fill="#fbe1e1"/><text x="315" y="926" text-anchor="middle" font-size="16" font-weight="700" fill="#c62828">Self-intersecting polygon, accepted silently</text><rect x="610" y="480" width="550" height="470" rx="14" fill="#f6f8fa" stroke="#e6e8eb"/><text x="630" y="512" font-size="20" font-weight="700" fill="#1f2328">Geomerge: merge, check the shape, repair</text><text x="630" y="535" font-size="15" fill="#5b636e">The two crossing edits (dashed) are held back and reported</text><polygon points="741.6666666666666,865.3333333333334 1028.3333333333333,865.3333333333334 1028.3333333333333,578.6666666666666 913.6666666666666,750.6666666666667 856.3333333333333,750.6666666666667 741.6666666666666,578.6666666666666" fill="#dcefe2" stroke="#1f7a3d" stroke-width="3"  stroke-linejoin="round" fill-rule="nonzero"/><circle cx="913.6666666666666" cy="750.6666666666667" r="8" fill="#c26a00" stroke="#fff" stroke-width="2.5"/><circle cx="856.3333333333333" cy="750.6666666666667" r="8" fill="#7a3fb8" stroke="#fff" stroke-width="2.5"/><line x1="913.6666666666666" y1="750.6666666666667" x2="1057" y2="693.3333333333334" stroke="#c26a00" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrow-a)"/><line x1="856.3333333333333" y1="750.6666666666667" x2="712.9999999999999" y2="693.3333333333334" stroke="#7a3fb8" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrow-b)"/><rect x="626" y="904" width="518" height="32" rx="8" fill="#dcefe2"/><text x="885" y="926" text-anchor="middle" font-size="16" font-weight="700" fill="#1f7a3d">Valid polygon + conflicts: [3, 4] for review</text></g>
</svg>
